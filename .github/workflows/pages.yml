name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer python-markdown
        run: python -m pip install --quiet markdown
      - name: Construire le site
        run: python tools/build_site.py site/
      - name: Vérifier les pages produites
        run: |
          test -s site/index.html
          for p in tamis glane eclat classement inventaire idees; do
            test -s "site/$p.html" || { echo "page manquante : $p"; exit 1; }
          done
          grep -q '<table' site/inventaire.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
