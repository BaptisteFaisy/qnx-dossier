name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Licence présente et détectable
        run: test -s LICENSE
      - name: Sources présentes
        run: |
          test -s index.md
          for f in TAMIS-cahier-des-charges GLANE-cahier-des-charges ECLAT-cahier-des-charges \
                   qnx-classement-final qnx-inventaire-officiel qnx-100-idees-5sem; do
            test -s "src/$f.md" || { echo "source manquante : $f"; exit 1; }
          done
      - name: Taille des fichiers de code
        run: |
          find tools -name '*.py' | while read -r f; do
            n=$(wc -l < "$f")
            test "$n" -lt 500 || { echo "$f dépasse 500 lignes ($n)"; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet markdown
      - name: Le générateur fonctionne
        run: python tools/build_site.py /tmp/site-ci && test -s /tmp/site-ci/index.html
